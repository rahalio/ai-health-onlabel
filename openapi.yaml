openapi: 3.0.3
info:
  title: Onlabel
  version: 0.1.0
  description: >-
    Compliance-gated commercial orchestration for life sciences. Candidate actions are
    evaluated against local label version, approved asset validity, engagement mode,
    HCP consent and disclosure duty before ranking, so field teams receive only what is
    executable today. Interactions return through mandatory transfer-of-value capture
    and adverse-event routing, and the medical-commercial separation is enforced as a
    read boundary rather than a policy.
  x-product-slug: ai-health-onlabel
  x-source: ai-in-health/Accenture-Intelligent-Commercial-Solution-Life-Sciences/
servers:
  - url: https://api.example.com
tags:
  - name: Labels
    description: Local label versions, approved claims, and approved asset validity
  - name: Permissions
    description: Engagement mode matrix, consent, and per-action permission evaluation
  - name: Actions
    description: Gated next-best-action queue, targeting rationale, and unblock requests
  - name: Interactions
    description: Field interactions with mandatory closure duties
  - name: Transparency
    description: Transfer-of-value capture and statutory disclosure reconciliation
  - name: Safety
    description: Adverse event and product complaint intake with pharmacovigilance routing
  - name: Medical
    description: Unsolicited information requests and scientific exchange behind the wall
  - name: Payer
    description: Value dossiers and health-system evidence engagement
  - name: Governance
    description: MLR review, affiliate market activation, and control events
  - name: Reporting
    description: Engagement performance, cost per engaged HCP, and asset utilisation
paths:
  /v1/brands/{brandId}/label-versions:
    parameters:
      - $ref: "#/components/parameters/BrandId"
    get:
      operationId: listLabelVersions
      summary: List locally approved label versions by market
      tags: [Labels]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: market
          in: query
          schema:
            type: string
            example: DE
      responses:
        "200":
          description: Label versions page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeLabelVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: publishLabelVersion
      summary: Publish a label version and cascade withdrawal of affected assets
      description: >-
        Publishing a new local label immediately withdraws every asset and queued
        action in that market whose claim set is no longer on-label.
      tags: [Labels]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelVersionCreate"
      responses:
        "201":
          description: Label version published with withdrawal cascade summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeLabelVersion"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/approved-claims:
    get:
      operationId: listApprovedClaims
      summary: List approved claims with their reference mappings
      tags: [Labels]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: brandId
          in: query
          schema:
            type: string
        - name: market
          in: query
          schema:
            type: string
        - name: onLabelOnly
          in: query
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Approved claims page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeApprovedClaim"
  /v1/approved-assets:
    get:
      operationId: listApprovedAssets
      summary: List approved assets with validity windows and market activations
      tags: [Labels]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: brandId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [in_review, approved, expiring, expired, withdrawn]
      responses:
        "200":
          description: Approved assets page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeApprovedAsset"
  /v1/approved-assets/{assetId}/withdrawal:
    parameters:
      - $ref: "#/components/parameters/AssetId"
    post:
      operationId: withdrawApprovedAsset
      summary: Withdraw an asset and purge dependent queued actions
      tags: [Labels]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, initiatedBy]
              properties:
                reason:
                  type: string
                  enum:
                    [
                      label_change,
                      approval_expired,
                      reference_retracted,
                      safety_update,
                      affiliate_request,
                      compliance_finding,
                    ]
                initiatedBy:
                  type: string
                markets:
                  type: array
                  items:
                    type: string
      responses:
        "202":
          description: Withdrawal accepted and dependent actions purged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeApprovedAsset"
  /v1/engagement-modes:
    get:
      operationId: listEngagementModes
      summary: List engagement modes with permitted roles, content classes and channels
      tags: [Permissions]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Engagement modes page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeEngagementMode"
  /v1/actions/evaluate:
    post:
      operationId: evaluateActionPermission
      summary: Evaluate whether an audience, message and channel triple is executable now
      tags: [Permissions]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionEvaluationRequest"
      responses:
        "200":
          description: Permission evaluation with named refusals and their owners
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePermissionEvaluation"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/hcps/{hcpId}/consent:
    parameters:
      - $ref: "#/components/parameters/HcpId"
    get:
      operationId: getHcpConsent
      summary: Get per-jurisdiction channel consent and opt-out state
      tags: [Permissions]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Consent in force
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeHcpConsent"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: setHcpConsent
      summary: Record or amend channel consent captured from the HCP
      tags: [Permissions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HcpConsentUpsert"
      responses:
        "200":
          description: Consent recorded with lawful basis and capture evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeHcpConsent"
  /v1/actions:
    get:
      operationId: listSuggestedActions
      summary: List the gated action queue for a field user
      description: >-
        Returns only actions whose permission evaluation currently passes. Refused
        candidates are reported separately through the control ledger.
      tags: [Actions]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: fieldUserId
          in: query
          schema:
            type: string
        - name: brandId
          in: query
          schema:
            type: string
        - name: engagementModeCode
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Executable actions page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeSuggestedAction"
  /v1/actions/{actionId}/rationale:
    parameters:
      - $ref: "#/components/parameters/ActionId"
    get:
      operationId: getTargetingRationale
      summary: Get the business-language rationale for why this HCP, message and timing
      tags: [Actions]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Targeting rationale with licensed-data use attestation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTargetingRationale"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/actions/{actionId}/unblock-request:
    parameters:
      - $ref: "#/components/parameters/ActionId"
    post:
      operationId: requestActionUnblock
      summary: Route a refused action to the owner who can clear it
      tags: [Actions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refusalCode]
              properties:
                refusalCode:
                  $ref: "#/components/schemas/RefusalCode"
                requestedBy:
                  type: string
                note:
                  type: string
      responses:
        "202":
          description: Unblock request routed to reviewer, affiliate lead, or consent capture
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSuggestedAction"
  /v1/interactions:
    post:
      operationId: recordInteraction
      summary: Open an interaction against an executed action
      tags: [Interactions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InteractionCreate"
      responses:
        "201":
          description: Interaction opened with outstanding closure duties listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeInteraction"
  /v1/interactions/{interactionId}/close:
    parameters:
      - $ref: "#/components/parameters/InteractionId"
    post:
      operationId: closeInteraction
      summary: Close an interaction once transparency and safety duties are discharged
      tags: [Interactions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adverseEventMentioned]
              properties:
                adverseEventMentioned:
                  type: boolean
                productComplaintMentioned:
                  type: boolean
                callNote:
                  type: string
      responses:
        "200":
          description: Interaction closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeInteraction"
        "409":
          description: Adverse event routing unconfirmed or transfer of value uncaptured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/interactions/{interactionId}/transfers-of-value:
    parameters:
      - $ref: "#/components/parameters/InteractionId"
    post:
      operationId: captureTransferOfValue
      summary: Capture a reportable transfer of value at the point of interaction
      tags: [Transparency]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferOfValueCreate"
      responses:
        "201":
          description: Transfer captured and mapped to the jurisdiction's disclosure rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTransferOfValue"
  /v1/transparency/submissions:
    get:
      operationId: listDisclosureSubmissions
      summary: List statutory disclosure submissions by jurisdiction and period
      tags: [Transparency]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: regime
          in: query
          schema:
            type: string
            enum: [us_open_payments, efpia_disclosure_code, local_statutory, voluntary]
        - name: period
          in: query
          schema:
            type: string
            example: 2026
      responses:
        "200":
          description: Disclosure submissions page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeDisclosureSubmission"
  /v1/transparency/submissions/{submissionId}/reconciliation:
    parameters:
      - $ref: "#/components/parameters/SubmissionId"
    post:
      operationId: reconcileDisclosureSubmission
      summary: Reconcile captured transfers to a submission without manual rework
      tags: [Transparency]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reconciledBy:
                  type: string
                acceptVariances:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Reconciliation result with unmatched and disputed transfers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDisclosureSubmission"
  /v1/safety/adverse-events:
    post:
      operationId: captureAdverseEvent
      summary: Capture an adverse event or product complaint from any interaction
      tags: [Safety]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdverseEventCaptureCreate"
      responses:
        "201":
          description: Capture recorded with pharmacovigilance routing clock started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAdverseEventCapture"
  /v1/information-requests:
    get:
      operationId: listInformationRequests
      summary: List unsolicited information requests handled as scientific exchange
      description: >-
        Accessible to medical identities only. Commercial identities receive 403, which
        is how the medical-commercial read boundary is enforced.
      tags: [Medical]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [received, triaged, fulfilled, escalated, closed]
      responses:
        "200":
          description: Information requests page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeInformationRequest"
        "403":
          description: Commercial identity attempted to read scientific exchange content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/information-requests/{requestId}/fulfilment:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: fulfilInformationRequest
      summary: Record fulfilment of an unsolicited request with its reference set
      tags: [Medical]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [responseReferenceIds, fulfilledBy]
              properties:
                responseReferenceIds:
                  type: array
                  items:
                    type: string
                fulfilledBy:
                  type: string
                responseSummary:
                  type: string
      responses:
        "200":
          description: Fulfilment recorded as scientific exchange
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeInformationRequest"
  /v1/payer/value-dossiers:
    get:
      operationId: listValueDossiers
      summary: List approved economic evidence dossiers for payer engagement
      tags: [Payer]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: brandId
          in: query
          schema:
            type: string
        - name: payerOrganisationId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Value dossiers page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeValueDossier"
  /v1/payer/engagements:
    post:
      operationId: recordPayerEngagement
      summary: Record a payer or health-system engagement against its committed metric
      tags: [Payer]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayerEngagementCreate"
      responses:
        "201":
          description: Engagement recorded under the payer evidence mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeInteraction"
        "409":
          description: Promotional claim attempted inside a payer evidence engagement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mlr-reviews:
    get:
      operationId: listMlrReviews
      summary: List medical, legal and regulatory reviews and their claim deltas
      tags: [Governance]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: state
          in: query
          schema:
            type: string
            enum: [queued, in_review, approved, rejected, withdrawn]
      responses:
        "200":
          description: MLR reviews page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeMlrReview"
    post:
      operationId: submitClaimDelta
      summary: Submit only the delta between a proposed message and approved claims
      tags: [Governance]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MlrReviewCreate"
      responses:
        "201":
          description: Review queued, or auto-resolved by claim reuse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeMlrReview"
  /v1/market-activations:
    post:
      operationId: activateAssetInMarket
      summary: Record local affiliate approval activating an asset in a market
      tags: [Governance]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketActivationCreate"
      responses:
        "201":
          description: Asset activated in market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeMarketActivation"
        "403":
          description: Approver does not hold activation authority for this market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/governance/control-events:
    get:
      operationId: listControlEvents
      summary: List blocked actions, wall breaches, and patient-data access attempts
      tags: [Governance]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: controlType
          in: query
          schema:
            type: string
            enum:
              [
                action_refused,
                wall_read_blocked,
                patient_data_access_blocked,
                licensed_data_restriction_enforced,
                off_label_claim_blocked,
                expired_asset_blocked,
              ]
      responses:
        "200":
          description: Control events page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeControlEvent"
  /v1/reports/engagement-performance:
    get:
      operationId: getEngagementPerformance
      summary: Get execution rate, asset utilisation and cost per engaged HCP
      tags: [Reporting]
      security:
        - BearerAuth: []
      parameters:
        - name: brandId
          in: query
          schema:
            type: string
        - name: market
          in: query
          schema:
            type: string
        - name: period
          in: query
          schema:
            type: string
            example: 2026-Q3
      responses:
        "200":
          description: Engagement performance metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeEngagementPerformanceMetric"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    BrandId:
      name: brandId
      in: path
      required: true
      schema:
        type: string
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
    HcpId:
      name: hcpId
      in: path
      required: true
      schema:
        type: string
    ActionId:
      name: actionId
      in: path
      required: true
      schema:
        type: string
    InteractionId:
      name: interactionId
      in: path
      required: true
      schema:
        type: string
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        refusalCode:
          $ref: "#/components/schemas/RefusalCode"
        unblockOwnerRole:
          type: string
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          format: double
        currency:
          type: string
          example: EUR
    RefusalCode:
      type: string
      enum:
        [
          off_label_for_market,
          asset_expired,
          asset_not_activated_in_market,
          claim_not_approved,
          engagement_mode_not_permitted_for_role,
          channel_consent_missing,
          hcp_opted_out,
          transparency_rule_uncomputable,
          licensed_data_restriction,
          medical_commercial_wall,
          patient_data_excluded,
          affiliate_approval_pending,
        ]
    Brand:
      type: object
      required: [id, name, therapeuticArea]
      properties:
        id:
          type: string
        name:
          type: string
        therapeuticArea:
          type: string
        launchPhase:
          type: string
          enum: [pre_launch, launch, growth, mature, loss_of_exclusivity]
        markets:
          type: array
          items:
            type: string
        indicationIds:
          type: array
          items:
            type: string
    Indication:
      type: object
      required: [id, brandId, description]
      properties:
        id:
          type: string
        brandId:
          type: string
        description:
          type: string
        approvedMarkets:
          type: array
          items:
            type: string
        populationRestrictions:
          type: string
    LabelVersion:
      type: object
      required: [id, brandId, market, version, effectiveFrom]
      properties:
        id:
          type: string
        brandId:
          type: string
        market:
          type: string
          description: ISO country code for the locally approved label
        version:
          type: string
        indicationIds:
          type: array
          items:
            type: string
        effectiveFrom:
          type: string
          format: date
        supersedesVersionId:
          type: string
        sourceRepositoryRef:
          type: string
        withdrawalCascade:
          type: object
          properties:
            assetsWithdrawn:
              type: integer
            queuedActionsPurged:
              type: integer
            completedAt:
              type: string
              format: date-time
    LabelVersionCreate:
      type: object
      required: [market, version, effectiveFrom, indicationIds]
      properties:
        market:
          type: string
        version:
          type: string
        indicationIds:
          type: array
          items:
            type: string
        effectiveFrom:
          type: string
          format: date
        sourceRepositoryRef:
          type: string
    ApprovedClaim:
      type: object
      required: [id, brandId, market, text, status]
      properties:
        id:
          type: string
        brandId:
          type: string
        market:
          type: string
        text:
          type: string
        indicationId:
          type: string
        labelVersionId:
          type: string
        references:
          type: array
          items:
            type: object
            properties:
              referenceId:
                type: string
              citation:
                type: string
              retracted:
                type: boolean
